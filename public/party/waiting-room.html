<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoExplorer | Party Lobby</title>

  <link rel="stylesheet" href="/styles/menu-style.css">
  <link rel="stylesheet" href="/styles/waiting-room-style.css">
  <link rel="icon" href="/Resources/Images/icon.ico" type="image/x-icon">

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/utils/auth-check.js"></script>
  <script type="module" src="/js/components/profile-menu.js"></script>
  <script src="/js/components/loader.js"></script>
  <script type="module" src="/js/pages/party/waiting-room.js"></script>
</head>

<body>
  <div data-component="/components/site-header.html"></div>

  <main class="party-main">
    <div class="party-container">
      <h2 class="party-lobby-title">Party Lobby</h2>

      <div class="party-header">
        <span class="party-code-container">Party Code: <span id="party-code">XXXXXX</span></span>
      </div>

      <div class="party-body">
        <!-- Panel for FFA / Team 1 -->
        <div class="party-section players" id="panel-left">
          <h3>Players</h3>
          <ul id="players-list-left"></ul>
        </div>

        <!-- Panel for Team 2 (only used in Teams mode) -->
        <div class="party-section players" id="panel-right" style="display:none;">
          <h3>Team 2</h3>
          <ul id="players-list-right"></ul>
        </div>
      </div>

      <div class="party-footer">
        <button id="leave-btn" class="secondary">Leave</button>
        <button id="rejoin-game-btn" class="rejoin">Rejoin</button>
      </div>

    </div>

  </main>

  <div data-component="/components/site-footer.html"></div>

  <!-- Disband / Confirmation Modal -->
  <div class="disband-modal-overlay" id="disband-modal-overlay" style="display:none;">
    <div class="disband-modal">
      <button id="disband-close-btn" aria-label="Close">
        <span class="close-symbol">&times;</span>
      </button>
      <h2>Disband Party</h2>
      <p>Are you sure you want to disband this party? This action cannot be undone.</p>
      <div style="display:flex; justify-content:center; gap:1rem;">
        <button class="danger" id="disband-confirm-btn">Disband</button>
        <button class="secondary" id="disband-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

</body>

</html>
