<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles/menu-style.css" />
    <link rel="stylesheet" href="/styles/login-style.css" />
    <link rel="Icon" href="/Resources/Images/icon.ico" type="image/x-icon" />
    <script type="module" src="/js/pages/auth/forgot-password-reset.js"></script>
    <script src="/js/components/loader.js"></script>
    <title>GeoExplorer | Reset Password</title>
</head>

<body>
    <div class="wave-container" data-component="/components/top-waves.html"></div>

    <section id="login-panel">
        <div class="login-container">
            <h2>Set a new <strong class="green-title">password</strong></h2>

            <form method="POST" class="basic-form" id="reset-password-form">
                <div class="form-group">
                    <label for="password" data-required="*">New password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" maxlength="20" required />
                    <small class="input-feedback">Use at least 8 characters.</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" data-required="*">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="8" maxlength="20" required />
                </div>
                <button type="submit" class="login-button">Update password</button>
                <div id="update-message" class="update-message" aria-live="polite" role="alert"></div>
            </form>

            <p class="footer-text"><a href="/login.html">Back to login</a></p>
        </div>
    </section>

    <div class="wave-container" data-component="/components/fixed-bottom-waves.html"></div>
</body>

</html>
