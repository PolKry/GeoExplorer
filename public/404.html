<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoExplorer | Page Not Found</title>

    <link rel="stylesheet" href="/styles/menu-style.css">
    <link rel="stylesheet" href="/styles/404-style.css">
    <link rel="icon" href="/resources/images/icon.ico" type="image/x-icon">

    <script type="module" src="/js/components/profile-menu.js"></script>
    <script src="/js/components/loader.js"></script>
</head>

<body>
    <div data-component="/components/site-header.html"></div>

    <main class="error-main fade-in">
        <div class="error-box">
            <h1 class="error-title">404</h1>
            <h2 class="error-subtitle">Page Not Found</h2>

            <p class="error-text">
                The page you're looking for doesn't exist or is not available yet.
            </p>

            <ul class="reasons-list">
                <li>The URL you entered might be incorrect</li>
                <li>The page is still under construction</li>
                <li>The server encountered an issue</li>
            </ul>

            <button class="back-button"><a href="/">Return Home</a></button>
        </div>
    </main>

    <div data-component="/components/site-footer.html"></div>
</body>

</html>
