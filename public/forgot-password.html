<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles/menu-style.css" />
    <link rel="stylesheet" href="/styles/login-style.css" />
    <link rel="Icon" href="/Resources/Images/icon.ico" type="image/x-icon" />
    <script type="module" src="/js/pages/auth/forgot-password.js"></script>
    <script src="/js/components/loader.js"></script>
    <title>GeoExplorer | Forgot Password</title>
</head>

<body>
    <div class="wave-container" data-component="/components/top-waves.html"></div>

    <section id="login-panel">
        <div class="login-container">
            <h2>Reset your <strong class="green-title">password</strong></h2>

            <form method="POST" class="basic-form" id="forgot-password-form">
                <div class="form-group">
                    <label for="email" data-required="*">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required />
                    <small class="input-feedback">Enter the address linked to your account.</small>
                </div>
                <button type="submit" class="login-button">Send reset link</button>
                <div id="update-message" class="update-message" aria-live="polite" role="alert"></div>
            </form>

            <p class="footer-text"><a href="/login.html">Back to login</a></p>
        </div>
    </section>

    <div class="wave-container" data-component="/components/fixed-bottom-waves.html"></div>
</body>

</html>
