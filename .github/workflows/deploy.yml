name: GeoExplorer CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Test Tailscale connectivity
        run: |
          echo "=== Tailscale status ==="
          tailscale status

          echo
          echo "=== Ping Raspberry Pi ==="
          tailscale ping 100.117.234.78

          echo
          echo "=== TCP 22 ==="
          timeout 10 bash -c '</dev/tcp/100.117.234.78/22'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/geoexplorer
          chmod 600 ~/.ssh/geoexplorer

          echo "${{ secrets.PI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Raspberry Pi
        run: |
          ssh -i ~/.ssh/geoexplorer \
            "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
            'cd /mnt/ssd/GeoExplorer && git fetch origin && git reset --hard origin/main'

      - name: Install production dependencies
        run: |
          ssh -i ~/.ssh/geoexplorer \
            "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
            'cd /mnt/ssd/GeoExplorer && npm ci --omit=dev'

      - name: Restart GeoExplorer
        run: |
          ssh -i ~/.ssh/geoexplorer \
            "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
            'sudo systemctl restart geoexplorer'

      - name: Verify GeoExplorer
        run: |
          ssh -i ~/.ssh/geoexplorer \
            "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
            'sudo systemctl is-active --quiet geoexplorer'