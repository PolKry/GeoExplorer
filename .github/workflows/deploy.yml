name: GeoExplorer CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Test Tailscale connectivity
        shell: bash
        run: |
          echo "=== Tailscale status ==="
          tailscale status

          echo
          echo "=== Tailscale IP ==="
          tailscale ip -4

          echo
          echo "=== Ping Pi ==="
          tailscale ping 100.117.234.78

          echo
          echo "=== TCP 22 ==="
          timeout 10 bash -c '</dev/tcp/100.117.234.78/22' \
            && echo "SSH port is reachable" \
            || (echo "SSH port is NOT reachable" && exit 1)