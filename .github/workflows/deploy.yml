name: GeoExplorer CI/CD

on:
    push:
        branches:
            - main

    workflow_dispatch:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

    deploy:
        name: Deploy to Raspberry Pi
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Connect to Tailscale
              uses: tailscale/github-action@v3
              with:
                oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                tags: tag:github-actions

            - name: Setup SSH
              shell: bash
              run: |
                  mkdir -p ~/.ssh

                  echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/geoexplorer_actions
                  chmod 600 ~/.ssh/geoexplorer_actions

                  echo "${{ secrets.PI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts

            - name: Deploy files to Raspberry Pi
              shell: bash
              run: |
                  tar \
                    --exclude='.git' \
                    --exclude='node_modules' \
                    --exclude='.env' \
                    -czf - . \
                  | ssh \
                      -i ~/.ssh/geoexplorer_actions \
                      "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
                      'mkdir -p /mnt/ssd/GeoExplorer && tar -xzf - -C /mnt/ssd/GeoExplorer'

            - name: Install production dependencies and restart
              shell: bash
              run: |
                  ssh \
                    -i ~/.ssh/geoexplorer_actions \
                    "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
                    'cd ~/GeoExplorer &&
                     npm ci --omit=dev &&
                     sudo systemctl restart geoexplorer &&
                     sudo systemctl is-active --quiet geoexplorer'
